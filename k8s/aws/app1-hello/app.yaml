apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
        - name: app1-hello
          image: koushik395/hello-node:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ENV_VALUE
              value: "Hello from koushik with changes done in app.yaml"
            - name: DB_PASSWORD
              value: "cGFzc3dvcmQ=" # base64 for 'password'
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
spec:
  selector:
    app: app1-hello
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
