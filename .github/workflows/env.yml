name: Demo CI Env Secrets build

on:
  push:
    branches: [main]
  # workflow_dispatch:

env:
  GLOBAL_ENV: demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Install
        env:
          APP_ENV: demo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment ${GLOBAL_ENV} is set for the build using ${DB_PASSWORD} and job env ${APP_ENV}."

      - name: Create a file
        run: |
          echo "Hello from the second workflow!" >> demo.txt
          echo "File created successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: test
        run: echo "Hello from the test job!"
