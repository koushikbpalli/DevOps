name: Demo CI Env Secrets build

on:
  # push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Install
        env:
          APP_ENV: demo
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment ${APP_ENV} is set for the build using ${DB_PASSWORD}."
