name: Tax Calculator Services CI/CD Pipeline
on:
  push:
    branches:
      - main
    paths:
      - docker/app2-tax-calculator/node/**
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    defaults:
      run:
        working-directory: docker/app2-tax-calculator/node/${{ matrix.service }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (If any)
        run: npm test --if-present

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service:
          - {
              name: service-a,
              context: docker/app2-tax-calculator/node/service-a,
              tag: tax-service-a:latest,
            }
          - {
              name: service-b,
              context: docker/app2-tax-calculator/node/service-b,
              tag: tax-service-b:latest,
            }
    defaults:
      run:
        working-directory: docker/app2-tax-calculator/node/${{ matrix.service.name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ${{ matrix.service.context }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.tag }}

  Deploy-to-AWS-EKS:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ap-south-1

      - name: Verify kubectl access
        run: |
          kubectl get nodes

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f k8s/aws/app2-tax-calculator/service-a/app.yaml
          kubectl apply -f k8s/aws/app2-tax-calculator/service-b/app.yaml

      - name: Roll out new image
        run: |
          kubectl rollout restart deployment/service-a
          kubectl rollout status deployment/service-a --timeout=120s
          kubectl rollout restart deployment/service-b
          kubectl rollout status deployment/service-b --timeout=120s
